# 适配 Next.js 15.2.4 的 Netlify 配置（纯英文，语法合规）
[build]
  command = "npm install --force && npm run build"
  publish = ".next"
  environment = { NODE_VERSION = "20.x", NPM_VERSION = "10.x" }

# 适配 Next.js 15.x 的 Netlify 插件
[[plugins]]
  package = "@netlify/plugin-nextjs"
  version = "6.0.0"

# 解决 Next.js 路由刷新 404 问题（简化版，避免解析错误）
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 修复图片优化路由（纯英文，无中文）
[[redirects]]
  from = "/_ipx/*"
  to = "/.netlify/images?url=:url&w=:width&q=:quality"
  status = 200
  query = { "q": ":quality", "url": ":url", "w": ":width" }
